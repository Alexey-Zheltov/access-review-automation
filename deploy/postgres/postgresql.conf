# PostgreSQL 18 settings for the Access Review portal (sample).
# Sized for a VM with 4 vCPU and 16 GB RAM that also runs the portal container. For other sizes, scale the memory values:
#   shared_buffers       ~ 25 % of the RAM given to PostgreSQL
#   effective_cache_size ~ 50-75 % of that RAM
# This file replaces the default postgresql.conf (docker-compose.yml starts postgres with -c config_file=...).
# Authentication rules stay in pg_hba.conf inside the data directory (created by the image: scram-sha-256).

# ---------------------------------------------------------------- connections
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# ---------------------------------------------------------------- memory
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB                 # per sort / hash; the review page sorts and filters large snapshots
maintenance_work_mem = 256MB    # index builds, VACUUM
dynamic_shared_memory_type = posix
huge_pages = try

# ---------------------------------------------------------------- write-ahead log and checkpoints
# A scan inserts tens or hundreds of thousands of rows in chunks: fewer, larger checkpoints are cheaper.
wal_buffers = 16MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = lz4

# ---------------------------------------------------------------- planner (SSD storage)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------- autovacuum
# Old snapshots are deleted in bulk: vacuum and analyze large tables earlier than the defaults.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# ---------------------------------------------------------------- logging (to the container log)
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 2000   # log queries slower than 2 s
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 64MB
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ---------------------------------------------------------------- locale
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
