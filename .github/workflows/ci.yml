# Build and unit tests on a GitHub-hosted runner. No secrets, no deployment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore AccessReviewPortal.slnx

      - name: Build
        run: dotnet build AccessReviewPortal.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test AccessReviewPortal.slnx -c Release --no-build

      - name: Bicep build
        run: |
          az bicep install
          for f in deploy/bicep/*.bicep; do az bicep build --file "$f" --stdout > /dev/null; done

      # The ARM templates (*.json next to the Bicep file) are used by "Deploy a custom template" in the Azure portal.
      - name: ARM templates match the Bicep files
        run: |
          for t in appservice appservice-existing-network; do
            az bicep build --file "deploy/bicep/$t.bicep" --outfile "$RUNNER_TEMP/$t.json"
            jq -S 'del(.. | ._generator?)' "$RUNNER_TEMP/$t.json" > "$RUNNER_TEMP/new.json"
            jq -S 'del(.. | ._generator?)' "deploy/bicep/$t.json" > "$RUNNER_TEMP/old.json"
            if ! diff -q "$RUNNER_TEMP/new.json" "$RUNNER_TEMP/old.json" > /dev/null; then
              echo "::error file=deploy/bicep/$t.json::Out of date. Run: az bicep build --file deploy/bicep/$t.bicep --outfile deploy/bicep/$t.json"
              exit 1
            fi
          done

      - name: Portal form is valid JSON
        run: jq -e '.parameters.outputs' deploy/bicep/appservice-existing-network.createUiDefinition.json > /dev/null
