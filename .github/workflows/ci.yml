# Build and unit tests on a GitHub-hosted runner. No secrets, no deployment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore AccessReviewPortal.slnx

      - name: Build
        run: dotnet build AccessReviewPortal.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test AccessReviewPortal.slnx -c Release --no-build

      - name: Bicep build
        run: |
          az bicep install
          for f in deploy/bicep/*.bicep; do az bicep build --file "$f" --stdout > /dev/null; done
