# Build and unit tests on a GitHub-hosted runner. No secrets, no deployment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore AccessReviewPortal.slnx

      - name: Build
        run: dotnet build AccessReviewPortal.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test AccessReviewPortal.slnx -c Release --no-build

      - name: Bicep build
        run: |
          az bicep install
          for f in deploy/bicep/*.bicep; do az bicep build --file "$f" --stdout > /dev/null; done

      # deploy/bicep/appservice.json is used by "Deploy a custom template" in the Azure portal.
      - name: ARM template matches the Bicep file
        run: |
          az bicep build --file deploy/bicep/appservice.bicep --outfile "$RUNNER_TEMP/appservice.json"
          jq -S 'del(.. | ._generator?)' "$RUNNER_TEMP/appservice.json" > "$RUNNER_TEMP/new.json"
          jq -S 'del(.. | ._generator?)' deploy/bicep/appservice.json > "$RUNNER_TEMP/old.json"
          if ! diff -q "$RUNNER_TEMP/new.json" "$RUNNER_TEMP/old.json" > /dev/null; then
            echo "::error file=deploy/bicep/appservice.json::Out of date. Run: az bicep build --file deploy/bicep/appservice.bicep --outfile deploy/bicep/appservice.json"
            exit 1
          fi
